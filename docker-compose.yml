services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"          # reachable only by other containers, not from outside

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"         # the only port exposed to the outside
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app